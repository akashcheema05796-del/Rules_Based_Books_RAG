# Query Decomposition (§6.8)
# Agentic RAG: 94.5% HotpotQA, 89.7% 2WikiMultiHop

method: "query_decomposition"
description: "LLM splits multi-hop query into sub-queries; retrieve per sub-query; merge"

# Decomposition parameters
max_sub_queries: 4
decomposition_max_tokens: 300

# For cross-reference queries only
target_query_types:
  - "cross_reference"
  - "multi_hop"

# Result merging
merge_strategy: "rrf"  # merge sub-query results via RRF
merge_rrf_k: 60
